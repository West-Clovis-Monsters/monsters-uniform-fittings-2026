    const { useState, useEffect, useRef } = React;

    // ── Firebase config — replace DB_URL with your Firebase Realtime DB URL ──
    // See Day-Of Logistics page for setup instructions
    const DB_URL = 'https://monsters-uniform-fittings-2026-default-rtdb.firebaseio.com';

    async function loadPlayers() {
      if (DB_URL) {
        try {
          const r = await fetch(DB_URL + '/wcm_fittings.json');
          const data = await r.json();
          if (data && Array.isArray(data) && data.length) return data;
          if (data && typeof data === 'object') {
            const arr = Object.values(data);
            if (arr.length) return arr;
          }
          // Firebase empty — use fresh SEED_PLAYERS, skip stale localStorage
          return SEED_PLAYERS;
        } catch(e) {
          console.warn('Firebase load failed, using localStorage', e);
          // Only fall back to localStorage if Firebase is unreachable
          try {
            const saved = JSON.parse(localStorage.getItem('wcm_fittings_v2') || 'null');
            if (saved && saved.length) return saved;
          } catch {}
        }
      }
      return SEED_PLAYERS;
    }

    async function persistPlayers(players) {
      // Always save to localStorage as backup
      try { localStorage.setItem('wcm_fittings_v2', JSON.stringify(players)); } catch {}
      // Also sync to Firebase if configured
      if (DB_URL) {
        try {
          await fetch(DB_URL + '/wcm_fittings.json', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(players),
          });
        } catch(e) { console.warn('Firebase save failed:', e); }
      }
    }

// ── Signature Canvas ─────────────────────────────────────────────────
function SignatureCanvas({ onSigned, onClear, hasSig }) {
  const canvasRef = React.useRef(null);
  const drawing   = React.useRef(false);
  const lastPos   = React.useRef(null);

  function getPos(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    const src  = e.touches ? e.touches[0] : e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  }
  function start(e) {
    e.preventDefault();
    drawing.current = true;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    lastPos.current = pos;
  }
  function move(e) {
    e.preventDefault();
    if (!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = "round";
    ctx.strokeStyle = GOLD;
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    lastPos.current = pos;
    onSigned(canvas.toDataURL());
  }
  function end() {
    drawing.current = false;
    const canvas = canvasRef.current;
    if (canvas) onSigned(canvas.toDataURL());
  }
  function clear() {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    onClear();
  }

  return (
    <div>
      <div style={{ position: "relative" }}>
        <canvas
          ref={canvasRef}
          width={480} height={130}
          onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end}
          style={{
            width: "100%", height: "130px", display: "block",
            background: G2, border: `2px solid ${hasSig ? GOLD : G3}`,
            borderRadius: "8px", cursor: "crosshair", touchAction: "none",
            transition: "border-color 0.2s",
          }}
        />
        {!hasSig && (
          <div style={{
            position: "absolute", inset: 0, display: "flex", alignItems: "center",
            justifyContent: "center", pointerEvents: "none",
          }}>
            <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: "13px", color: G4, letterSpacing: "1px" }}>
              SIGN ABOVE WITH MOUSE OR FINGER
            </span>
          </div>
        )}
      </div>
      {hasSig && (
        <button onClick={clear} style={{
          background: "none", border: "none", color: MUT, cursor: "pointer",
          fontFamily: "'Oswald', sans-serif", fontSize: "12px", letterSpacing: "1px",
          marginTop: "6px", padding: "4px 0", textDecoration: "underline",
        }}>CLEAR SIGNATURE</button>
      )}
    </div>
  );
}

  const [itemChecks,  setItemChecks]  = useState({});
  const [agreed,      setAgreed]      = useState(false);
  const [sigData,     setSigData]     = useState("");
  const [done,        setDone]        = useState(false);
  const [errors,      setErrors]      = useState({});

  const allItemsChecked = LOANED.every(({ item }) => {
    const isHelmet = item === "Helmet"; const isPads = item === "Shoulder Pads";
    if ((isHelmet && selected?.ownHelmet) || (isPads && selected?.ownPads)) return true;
    return !!itemChecks[item];
  });

  function toggleItem(item) {
    setItemChecks(prev => ({ ...prev, [item]: !prev[item] }));
    setErrors(x => ({ ...x, items: undefined }));
  }

  function reset() {
    setSelected(null); setSelLevel(""); setParentName("");
    setEmail(""); setPhone(""); setItemChecks({});
    setAgreed(false); setSigData(""); setDone(false); setErrors({});
  }

  function validate() {
    const e = {};
    if (!parentName.trim())            e.parentName = "Parent name is required";
    if (!email.trim() || !email.includes("@")) e.email = "Valid email is required";
    if (!phone.trim())                 e.phone = "Phone number is required";
    if (!allItemsChecked)              e.items = "Please acknowledge each loaned item";
    if (!agreed)                       e.agreed = "You must agree to the terms";
    if (!sigData)                      e.sig = "Signature is required";
    setErrors(e);
    return Object.keys(e).length === 0;

    if (!validate()) return;
    const updated = players.map(p =>
      p.id === selected.id
        ? {
            ...p,
            parentSigned: true,
            signerName:   parentName.trim(),
            signerEmail:  email.trim(),
            signerPhone:  phone.trim(),

                  #{selected.number}
                </span>
              )}
              <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: "13px", color: `${WHT}99` }}>{selected.level}</span>
            </div>
          </div>
          {selected.parentSigned && (
            <div style={{ background: `${GRN}22`, border: `1px solid ${GRN}55`, borderRadius: "8px", padding: "8px 14px", textAlign: "center" }}>
              <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "10px", color: GRN, letterSpacing: "1px" }}>✓ SIGNED</div>
              <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "10px", color: MUT, marginTop: "2px" }}>{selected.signerName}</div>
              <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "10px", color: MUT }}>{fmtDate(selected.signedAt)}</div>
            </div>
          )}
        </div>

        {/* ── Contact info ── */}
        <div style={{ background: G1, border: `1px solid ${G3}`, borderRadius: "10px", padding: "20px", marginBottom: "24px" }}>
          <Label>Parent / Guardian Information</Label>

          <div style={{ marginBottom: "12px" }}>
            <input
              type="text" placeholder="Full Name *"
              value={parentName} onChange={e => setParentName(e.target.value)}
              style={{ ...inputSt, borderColor: errors.parentName ? CARD : G3 }}
            />
            {errors.parentName && <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: CARD, marginTop: "4px" }}>{errors.parentName}</div>}
          </div>

          <div style={{ marginBottom: "12px" }}>
            <input
              type="email" placeholder="Email Address *"
              value={email} onChange={e => setEmail(e.target.value)}
              style={{ ...inputSt, borderColor: errors.email ? CARD : G3 }}
            />
            {errors.email && <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: CARD, marginTop: "4px" }}>{errors.email}</div>}
          </div>

          <div>
            <input
              type="tel" placeholder="Phone Number *"
              value={phone} onChange={e => setPhone(e.target.value)}
              style={{ ...inputSt, borderColor: errors.phone ? CARD : G3 }}
            />
            {errors.phone && <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: CARD, marginTop: "4px" }}>{errors.phone}</div>}
          </div>
        </div>

        {/* ── Equipment breakdown ── */}
        <Label>Loaned for Season — Must Be Returned</Label>
        <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "12px", color: MUT, marginBottom: "12px" }}>
          Check each item to acknowledge the replacement cost. All items must be returned at the end of the season in acceptable condition.
        </div>
        {LOANED.map(({ item, cost }) => {
          const isHelmet = item === "Helmet";
          const isPads   = item === "Shoulder Pads";
          const playerOwns = (isHelmet && selected.ownHelmet) || (isPads && selected.ownPads);
          if (playerOwns) {
            return (
              <div key={item} style={{
                display: "flex", alignItems: "center", gap: "14px",
                background: `${GRN}0f`, border: `1px solid ${GRN}33`,
                borderLeft: `4px solid ${GRN}`, borderRadius: "6px", padding: "14px 16px", marginBottom: "8px",
              }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: "15px", color: WHT }}>{item}</div>
                  <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: GRN, marginTop: "2px" }}>Player providing their own — no charge</div>
                </div>
                <div style={{ fontFamily: "'Anton', sans-serif", fontSize: "22px", color: GRN, flexShrink: 0 }}>{"$0"}</div>
              </div>
            );
          }
          const checked = !!itemChecks[item];
          return (
            <label key={item} onClick={() => toggleItem(item)} style={{
              display: "flex", alignItems: "center", gap: "14px",
              background: checked ? `${GRN}0f` : G1,
              borderLeft: `4px solid ${checked ? GRN : CARD}`,
              border: `1px solid ${checked ? `${GRN}44` : G3}`,
              borderLeft: `4px solid ${checked ? GRN : CARD}`,
              borderRadius: "6px", padding: "14px 16px", marginBottom: "8px",
              cursor: "pointer", transition: "all 0.15s",
            }}>
              <div style={{
                width: "22px", height: "22px", borderRadius: "5px", flexShrink: 0,
                background: checked ? GRN : G3,
                border: `2px solid ${checked ? GRN : G4}`,
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "all 0.15s",
              }}>
                {checked && <span style={{ color: WHT, fontSize: "14px", fontWeight: 700, lineHeight: 1 }}>✓</span>}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: "15px", color: WHT }}>{item}</div>
              </div>
              <div style={{ fontFamily: "'Anton', sans-serif", fontSize: "22px", color: checked ? GRN : GOLD, flexShrink: 0, transition: "color 0.15s" }}>
                ${cost}
              </div>
            </label>
          );
        })}
        {errors.items && (
          <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: CARD, marginBottom: "8px" }}>{errors.items}</div>
        )}

        {/* Total liability */}
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          background: `${CARD}33`, border: `1px solid ${CARD}88`,
          borderRadius: "8px", padding: "16px 18px", margin: "4px 0 24px",
        }}>
          <div>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 700, fontSize: "11px", letterSpacing: "2px", color: `${WHT}99`, textTransform: "uppercase" }}>
              Total Replacement Liability
            </div>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: MUT, marginTop: "2px" }}>
              Charged if equipment is not returned
            </div>
          </div>
          <div style={{ fontFamily: "'Anton', sans-serif", fontSize: "32px", color: GOLD }}>${LOANED.reduce((s,i) => s + ((i.item==="Helmet" && selected.ownHelmet)||(i.item==="Shoulder Pads" && selected.ownPads) ? 0 : i.cost), 0)}</div>
        </div>

        <Label>Included in Registration — Yours to Keep</Label>
        {KEPT.map(({ item, note }) => (
          <div key={item} style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            background: G1, borderLeft: `4px solid ${GRN}55`, borderRadius: "6px",
            padding: "13px 16px", marginBottom: "8px",
          }}>
            <div>
              <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: "15px", color: WHT }}>{item}</div>
              <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: MUT }}>{note}</div>
            </div>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "12px", color: GRN, letterSpacing: "1px", flexShrink: 0, marginLeft: "12px" }}>KEEP ✓</div>
          </div>
        ))}

        {/* ── Agreement + Signature ── */}
        <div style={{ background: G1, border: `1px solid ${errors.agreed || errors.sig ? CARD : G3}`, borderRadius: "10px", padding: "20px", marginTop: "24px" }}>
          <Label>Equipment Return Agreement</Label>

          <div style={{
            background: G2, borderRadius: "8px", padding: "14px 16px",
            fontFamily: "'Montserrat', sans-serif", fontSize: "13px",
            color: `${WHT}cc`, lineHeight: 1.75, marginBottom: "18px",
          }}>
            I, <strong style={{ color: WHT }}>{parentName || "___________________"}</strong>, parent/guardian of{" "}
            <strong style={{ color: GOLD }}>{selected.name}</strong>, understand that the equipment listed above
            is loaned for the 2026 West Clovis Monsters season. I agree to return all loaned equipment in
            acceptable condition at the end of the season. If any item is not returned, I authorize West Clovis
            Monsters to charge the replacement cost listed above. Total potential liability:{" "}
            <strong style={{ color: GOLD }}>${LOANED.reduce((s,i)=>s+((i.item==="Helmet"&&selected.ownHelmet)||(i.item==="Shoulder Pads"&&selected.ownPads)?0:i.cost),0)}</strong>.
          </div>

          <label style={{ display: "flex", alignItems: "flex-start", gap: "12px", cursor: "pointer", marginBottom: "20px" }}>
            <input
              type="checkbox" checked={agreed}
              onChange={e => { setAgreed(e.target.checked); setErrors(x => ({ ...x, agreed: undefined })); }}
              style={{ marginTop: "2px", width: "20px", height: "20px", accentColor: GOLD, flexShrink: 0 }}
            />
            <span style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "13px", color: `${WHT}cc`, lineHeight: 1.5 }}>
              I have read and agree to the equipment return policy and understand the replacement costs listed above.
            </span>
          </label>
          {errors.agreed && <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: CARD, marginBottom: "12px" }}>{errors.agreed}</div>}

          <div style={{ marginBottom: "6px" }}>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "11px", letterSpacing: "2.5px", color: GOLD, textTransform: "uppercase", marginBottom: "10px" }}>
              Signature
            </div>
            <SignatureCanvas
              hasSig={!!sigData}
              onSigned={d => { setSigData(d); setErrors(x => ({ ...x, sig: undefined })); }}
              onClear={() => setSigData("")}
            />
            {errors.sig && <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: CARD, marginTop: "6px" }}>{errors.sig}</div>}
          </div>
        </div>

        <div style={{ marginTop: "24px" }}>
          <button onClick={handleSign} disabled={!canSubmit} style={btnSt(CARD, !canSubmit)}>
            {canSubmit ? "SUBMIT SIGNED AGREEMENT" : "COMPLETE ALL FIELDS TO SUBMIT"}
          </button>
          <button onClick={() => setSelected(null)} style={{ ...btnSt(G2), marginTop: "10px" }}>
            ← BACK
          </button>
        </div>
      </Screen>
    );
  }

  // ── Player picker ─────────────────────────────────────────────────
  return (
    <Screen title="PARENT SIGN-OFF" onBack={() => setScreen("home")}>
      <p style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "13px", color: MUT, lineHeight: 1.6, marginBottom: "20px", marginTop: 0 }}>
        Select your player's level, then choose their name to review and sign the equipment agreement.
      </p>
      {players.length === 0 ? (
        <Empty msg="No players in roster yet. Contact your team admin." />
      ) : (
        <LevelNamePicker players={players} onSelect={p => { setSelected(p); setErrors({}); }} syncLevel={selLevel} />
      )}
    </Screen>
  );
}

// ── Coach Station ────────────────────────────────────────────────────
function CoachScreen({ players, savePlayers, setScreen }) {
  const [syncLevel, setSyncLevel] = useState("");
  const [selected, setSelected]  = useState(null);
  const [form, setForm]          = useState({});
  const [flash, setFlash]        = useState("");

  function open(p) {
    setSelected(p);
    setForm({
      helmetBrand: p.helmetBrand || "",
      helmetSize:  p.helmetSize  || "",
      jerseySize:  p.jerseySize  || "",
      pantsSize:   p.pantsSize   || "",
      padsSize:    p.padsSize    || "",
      padsBrand:   p.padsBrand   || "",
      ownHelmet:   p.ownHelmet   || false,
      ownPads:     p.ownPads     || false,
      shoeType:    p.shoeType    || "",
      shoeSize:    p.shoeSize    || "",
    });
    setFlash("");
  }

  function save() {
    const updated = players.map(p =>
      p.id === selected.id
        ? { ...p, ...form, fittedAt: new Date().toISOString() }
        : p
    );
    savePlayers(updated);
    setFlash("✓ Saved!");
    setSelected(null);
    setTimeout(() => setFlash(""), 3000);
  }

  if (selected) {
    const f = form;
    const helmetOk = f.ownHelmet || (f.helmetBrand && f.helmetSize);
    const padsOk   = f.ownPads   || (f.padsSize && f.padsBrand);
    const canSave = helmetOk && f.jerseySize && f.pantsSize && padsOk;
    return (
      <Screen title="EQUIPMENT SIZING" onBack={() => { setSelected(null); setFlash(""); }}>
        {/* Header */}
        <div style={{
          background: CARD, borderRadius: "10px", padding: "16px 20px",
          marginBottom: "24px", display: "flex", justifyContent: "space-between", alignItems: "center",
        }}>
          <div>
            <div style={{ fontFamily: "'Anton', sans-serif", fontSize: "26px", color: WHT, letterSpacing: "1px" }}>{selected.name}</div>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "13px", color: GOLD }}>{selected.level}{selected.number ? ` · #${selected.number}` : ""}</div>
          </div>
          {isFitted(selected) && (
            <div style={{ background: `${GRN}22`, border: `1px solid ${GRN}55`, borderRadius: "6px", padding: "6px 12px" }}>
              <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "11px", color: GRN, letterSpacing: "1px" }}>✓ PREV FITTED</div>
              <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "10px", color: MUT }}>{fmtDate(selected.fittedAt)}</div>
            </div>
          )}
        </div>

        {flash && (
          <div style={{ background: `${GRN}22`, border: `1px solid ${GRN}`, borderRadius: "8px", padding: "12px 16px", marginBottom: "16px", fontFamily: "'Oswald', sans-serif", fontSize: "14px", color: GRN }}>
            {flash}
          </div>
        )}

        {/* Helmet */}
        {!f.ownHelmet && (
          <>
            <FieldSection label="Helmet Brand">
              <div style={{ display: "flex", gap: "10px" }}>
                {HELMET_BRANDS.map(b => <BrandBtn key={b} value={b} selected={f.helmetBrand === b} onClick={v => setForm(x => ({ ...x, helmetBrand: v }))} />)}
              </div>
            </FieldSection>
            <FieldSection label="Helmet Size">
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                {HELMET_SIZES.map(s => <SzBtn key={s} value={s} selected={f.helmetSize === s} onClick={v => setForm(x => ({ ...x, helmetSize: v }))} />)}
              </div>
            </FieldSection>
          </>
        )}
        <label style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", marginBottom: "24px",
          background: f.ownHelmet ? `${GOLD}15` : G1, border: `1px solid ${f.ownHelmet ? GOLD : G3}`,
          borderRadius: "8px", padding: "12px 16px" }}>
          <input type="checkbox" checked={!!f.ownHelmet}
            onChange={e => setForm(x => ({ ...x, ownHelmet: e.target.checked, helmetBrand: "", helmetSize: "" }))}
            style={{ width: "18px", height: "18px", accentColor: GOLD, flexShrink: 0 }} />
          <span style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: "14px", color: f.ownHelmet ? GOLD : WHT }}>
            Player will provide their own helmet
          </span>
        </label>

        {/* Pads */}
        {!f.ownPads && (
          <>
            <FieldSection label="Pads Brand">
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                {PADS_BRANDS.map(b => <BrandBtn key={b} value={b} selected={f.padsBrand === b} onClick={v => setForm(x => ({ ...x, padsBrand: v }))} />)}
              </div>
            </FieldSection>
            <FieldSection label="Pads Size">
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                {PADS_SIZES.map(s => <SzBtn key={s} value={s} selected={f.padsSize === s} onClick={v => setForm(x => ({ ...x, padsSize: v }))} />)}
              </div>
            </FieldSection>
          </>
        )}
        <label style={{ display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", marginBottom: "24px",
          background: f.ownPads ? `${GOLD}15` : G1, border: `1px solid ${f.ownPads ? GOLD : G3}`,
          borderRadius: "8px", padding: "12px 16px" }}>
          <input type="checkbox" checked={!!f.ownPads}
            onChange={e => setForm(x => ({ ...x, ownPads: e.target.checked, padsBrand: "", padsSize: "" }))}
            style={{ width: "18px", height: "18px", accentColor: GOLD, flexShrink: 0 }} />
          <span style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: "14px", color: f.ownPads ? GOLD : WHT }}>
            Player will provide their own pads
          </span>
        </label>

        {/* Jersey */}
        <FieldSection label="Jersey Size">
          <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
            {JERSEY_SIZES.map(s => <SzBtn key={s} value={s} selected={f.jerseySize === s} onClick={v => setForm(x => ({ ...x, jerseySize: v }))} />)}
          </div>
        </FieldSection>

        {/* Pants */}
        <FieldSection label="Pants Size">
          <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
            {PANTS_SIZES.map(s => <SzBtn key={s} value={s} selected={f.pantsSize === s} onClick={v => setForm(x => ({ ...x, pantsSize: v }))} />)}
          </div>
        </FieldSection>

        {/* Shoe Size */}
        <FieldSection label="Sock/Shoe Size">
          <div style={{ display: "flex", gap: "10px", marginBottom: "10px" }}>
            {["Youth", "Adult"].map(t => (
              <button key={t} onClick={() => setForm(x => ({ ...x, shoeType: t }))} style={{
                flex: 1, background: f.shoeType === t ? GOLD : G2,
                border: "1px solid " + (f.shoeType === t ? GOLD : G3),
                borderRadius: "8px", padding: "10px", color: f.shoeType === t ? BLK : WHT,
                fontFamily: "'Oswald', sans-serif", fontWeight: 700, fontSize: "14px",
                cursor: "pointer", transition: "all 0.12s",
              }}>{t}</button>
            ))}
          </div>
          {f.shoeType && (
            <input
              type="number" placeholder="Enter size (e.g. 5, 8.5)"
              value={f.shoeSize} onChange={e => setForm(x => ({ ...x, shoeSize: e.target.value }))}
              style={{ ...inputSt, width: "100%" }}
            />
          )}
        </FieldSection>

        <button onClick={save} disabled={!canSave} style={btnSt(CARD, !canSave)}>
          {canSave ? "SAVE FITTING" : "COMPLETE ALL SIZES TO SAVE"}
        </button>
        <button onClick={() => setSelected(null)} style={{ ...btnSt(G2), marginTop: "10px" }}>← BACK TO LIST</button>
      </Screen>
    );
  }

  // List view
  return (
    <Screen title="EQUIPMENT SIZING" onBack={() => setScreen("home")}>
      {flash && (
        <div style={{ background: `${GRN}22`, border: `1px solid ${GRN}`, borderRadius: "8px", padding: "12px 16px", marginBottom: "16px", fontFamily: "'Oswald', sans-serif", fontSize: "14px", color: GRN }}>
          {flash}
        </div>
      )}
      {/* Level stat tiles — tap to pre-select level in picker */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: "8px", marginBottom: "24px" }}>
        {["All", ...LEVELS].map(lv => {
          const lp = lv === "All" ? players : players.filter(p => p.level === lv);
          const lf = lp.filter(isFitted).length;
          const active = syncLevel === lv || (lv === "All" && syncLevel === "");
          return (
            <button key={lv} onClick={() => setSyncLevel(lv === "All" ? "" : lv)} style={{
              background: active ? CARD : G1,
              border: `1px solid ${active ? CARD_HI : G3}`,
              borderRadius: "8px", padding: "10px 6px",
              cursor: "pointer", textAlign: "center", transition: "all 0.12s",
            }}>
              <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 700, fontSize: "10px", color: active ? WHT : MUT, textTransform: "uppercase", letterSpacing: "0.5px" }}>{lv}</div>
              <div style={{ fontFamily: "'Anton', sans-serif", fontSize: "18px", color: GOLD }}>{lf}/{lp.length}</div>
            </button>
          );
        })}
      </div>

      {players.length === 0 ? (
        <Empty msg="No players yet. Scroll down to add players to the roster." />
      ) : (
        <LevelNamePicker players={players} onSelect={p => open(p)} syncLevel={syncLevel} />
      )}
    </Screen>
  );
}

// ── Roster View ──────────────────────────────────────────────────────
function RosterScreen({ players, savePlayers, setScreen }) {
  const [lvl, setLvl]   = useState("All");
  const [showExport, setShowExport] = useState(false);

  const list = sortAlpha(lvl === "All" ? players : players.filter(p => p.level === lvl));
  const fitted = list.filter(isFitted);

  function exportText() {
    const lines = ["West Clovis Monsters — 2026 Uniform Fittings", ""];
    const groupBy = lvl === "All" ? LEVELS : [lvl];
    groupBy.forEach(lv => {
      const grp = sortAlpha(players.filter(p => p.level === lv));
      if (!grp.length) return;
      lines.push(`── ${lv.toUpperCase()} (${grp.filter(isFitted).length}/${grp.length} fitted) ──`);
      grp.forEach(p => {
        if (isFitted(p)) {
          lines.push(`${p.name}${p.number ? ` #${p.number}` : ""} | Helmet: ${p.helmetBrand} ${p.helmetSize} | Jersey: ${p.jerseySize} | Pants: ${p.pantsSize} | Pads: ${p.padsBrand ? p.padsBrand + " " : ""}${p.padsSize}`);
        } else {
          lines.push(`${p.name}${p.number ? ` #${p.number}` : ""} | NOT YET FITTED`);
        }
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  return (
    <Screen title="ROSTER" onBack={() => setScreen("home")}>
      {/* Tabs */}
      <div style={{ display: "flex", gap: "8px", marginBottom: "16px", overflowX: "auto", paddingBottom: "4px" }}>
        {["All", ...LEVELS].map(lv => (
          <button key={lv} onClick={() => setLvl(lv)} style={{
            background: lvl === lv ? GOLD : G2, color: lvl === lv ? BLK : WHT,
            border: "none", borderRadius: "20px", padding: "8px 18px",
            fontFamily: "'Oswald', sans-serif", fontWeight: 700, fontSize: "13px",
            cursor: "pointer", whiteSpace: "nowrap", letterSpacing: "1px", textTransform: "uppercase",
          }}>{lv}</button>
        ))}
      </div>

      {/* Summary row */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
        <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "13px", color: MUT, letterSpacing: "1px", textTransform: "uppercase" }}>
          <span style={{ color: GRN }}>{fitted.length}</span> / {list.length} fitted
          {" · "}
          <span style={{ color: list.filter(p => p.parentSigned).length === list.length && list.length > 0 ? GRN : GOLD }}>
            {list.filter(p => p.parentSigned).length}
          </span> / {list.length} signed
        </div>
        <button onClick={() => setShowExport(s => !s)} style={{
          background: G2, border: `1px solid ${G3}`, borderRadius: "6px",
          padding: "6px 12px", color: GOLD, cursor: "pointer",
          fontFamily: "'Oswald', sans-serif", fontSize: "12px", letterSpacing: "1px",
        }}>
          {showExport ? "HIDE EXPORT" : "EXPORT ↓"}
        </button>
      </div>

      {/* Export text box */}
      {showExport && (
        <textarea
          readOnly value={exportText()}
          style={{
            ...inputSt, height: "200px", resize: "vertical",
            fontFamily: "monospace", fontSize: "11px",
            whiteSpace: "pre", marginBottom: "16px",
          }}
          onClick={e => e.target.select()}
        />
      )}

      {list.length === 0 ? (
        <Empty msg="No players in this group yet." />
      ) : (
        list.map(p => (
          <div key={p.id} style={{
            background: G1, borderRadius: "8px", padding: "14px 16px",
            marginBottom: "8px", borderLeft: `4px solid ${isFitted(p) ? GRN : G4}`,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "8px" }}>
              <div>
                <span style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 700, fontSize: "16px", color: WHT }}>
                  {p.name}{p.number ? <span style={{ color: GOLD, fontSize: "13px", marginLeft: "8px" }}>#{p.number}</span> : null}
                </span>
                <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "11px", color: MUT, marginTop: "2px" }}>{p.level}</div>
              </div>
              <div style={{ display: "flex", gap: "6px", alignItems: "center", flexShrink: 0 }}>
                {p.parentSigned && <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: "10px", color: GRN, background: `${GRN}22`, border: `1px solid ${GRN}44`, borderRadius: "4px", padding: "2px 6px", letterSpacing: "0.5px" }}>✓ SIGNED</span>}
                {!isFitted(p) && <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: "10px", color: GOLD, letterSpacing: "0.5px" }}>PENDING</span>}
              </div>
            </div>
            {isFitted(p) ? (
              <div style={{ display: "flex", flexWrap: "wrap", gap: "6px" }}>
                {[
                  ["Helmet", p.ownHelmet ? "Own Helmet ✓" : `${p.helmetBrand} ${p.helmetSize}`],
                  ["Jersey", p.jerseySize],
                  ["Pants", p.pantsSize],
                  ["Shoe", p.shoeType ? `${p.shoeType} ${p.shoeSize}` : ""],
                  ["Pads", p.ownPads ? "Own Pads ✓" : `${p.padsBrand ? p.padsBrand + " " : ""}${p.padsSize}`],
                ].map(([lbl, val]) => (
                  <div key={lbl} style={{
                    background: G2, borderRadius: "4px", padding: "4px 10px",
                    fontFamily: "'Oswald', sans-serif", fontSize: "12px", color: WHT,
                  }}>
                    <span style={{ color: GOLD }}>{lbl}:</span> {val}
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: "12px", color: MUT }}>Not yet fitted</div>
            )}
          </div>
        ))
      )}

      {/* ── Add Player ── */}
      <div style={{ marginTop: "40px", borderTop: `1px solid ${G3}`, paddingTop: "28px" }}>
        <Label>Add Player to Roster</Label>
        <RosterAddPlayer players={players} savePlayers={savePlayers} />
      </div>

    </Screen>
  );
}

// ── Add Player sub-component ─────────────────────────────────────────
function RosterAddPlayer({ players, savePlayers }) {
  const [name, setName]   = useState("");
  const [num, setNum]     = useState("");
  const [level, setLevel] = useState("Peewees");
  const [msg, setMsg]     = useState("");

  function add() {
    if (!name.trim()) return;
    const p = {
      id: uid(), name: name.trim(), number: num.trim(), level,
      helmetBrand: "", helmetSize: "", jerseySize: "", pantsSize: "",
      padsSize: "", padsBrand: "", ownHelmet: false, ownPads: false, shoeType: "", shoeSize: "", shoeType: "", shoeSize: "",
      parentSigned: false, signerName: "", signedAt: "", fittedAt: "",
    };
    savePlayers([...players, p]);
    setName(""); setNum("");
    setMsg(`${p.name} added to ${level}`);
    setTimeout(() => setMsg(""), 2500);
  }

  return (
    <div>
      <input type="text" placeholder="Player Full Name *" value={name} onChange={e => setName(e.target.value)} style={{ ...inputSt, marginBottom: "10px" }} />
      <input type="text" placeholder="Jersey Number (optional)" value={num} onChange={e => setNum(e.target.value)} style={{ ...inputSt, marginBottom: "14px" }} />
      <div style={{ display: "flex", gap: "8px", marginBottom: "16px" }}>
        {LEVELS.map(lv => (
          <button key={lv} onClick={() => setLevel(lv)} style={{
            flex: 1, background: level === lv ? CARD : G2,
            border: `1px solid ${level === lv ? CARD_HI : G3}`,
            borderRadius: "8px", padding: "11px 6px", color: WHT, cursor: "pointer",
            fontFamily: "'Oswald', sans-serif", fontWeight: 700, fontSize: "13px",
            textTransform: "uppercase", letterSpacing: "0.5px", transition: "all 0.12s",
          }}>{lv}</button>
        ))}
      </div>
      <button onClick={add} disabled={!name.trim()} style={btnSt(CARD, !name.trim())}>ADD PLAYER</button>
      {msg && (
        <div style={{ background: `${GRN}22`, border: `1px solid ${GRN}55`, borderRadius: "6px", padding: "10px 16px", marginTop: "12px", fontFamily: "'Oswald', sans-serif", fontSize: "14px", color: GRN }}>
          ✓ {msg}
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen]   = useState("home");
  const [players, setPlayers] = useState([]);
  const [ready, setReady]     = useState(false);

  useEffect(() => {
    loadPlayers().then(p => { setPlayers(p); setReady(true); });
  }, []);

  async function savePlayers(updated) {
    setPlayers(updated);
    await persistPlayers(updated);
  }

  if (!ready) {
    return (
      <div style={{ background: BLK, height: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontFamily: "'Anton', sans-serif", fontSize: "22px", color: GOLD, letterSpacing: "5px" }}>LOADING…</div>
      </div>
    );
  }

  const shared = { players, savePlayers, setScreen };
  return {
    home:   <HomeScreen setScreen={setScreen} />,
    parent: <ParentScreen {...shared} />,
    coach:  <CoachScreen  {...shared} />,
    roster: <RosterScreen players={players} savePlayers={savePlayers} setScreen={setScreen} />,
    logistics: <LogisticsScreen setScreen={setScreen} />,
  }[screen] || <HomeScreen setScreen={setScreen} />;
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
